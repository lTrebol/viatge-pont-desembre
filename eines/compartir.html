<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Imatge per compartir (1200 × 630)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;800&display=swap">
<style>
  /* Valors de DESIGN.md, apartat 9.12 */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #EAF5DF; color: #1C2618; font-family: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; position: relative; }
  .logo { position: absolute; left: 72px; top: 64px; width: 56px; height: 56px; background: #C9F296; border-radius: 3px; display: grid; place-items: center; }
  .logo svg { width: 34px; height: 34px; }
  h1 { position: absolute; left: 72px; top: 150px; margin: 0; font-size: 88px; font-weight: 500; letter-spacing: -.02em; line-height: 1.02; }
  .dates { position: absolute; left: 72px; top: 352px; margin: 0; font-size: 40px; font-weight: 500; }
  .sub { position: absolute; left: 72px; top: 420px; margin: 0; font-size: 26px; color: #5B6458; max-width: 560px; line-height: 1.3; }
  .peca { position: absolute; border-radius: 3px; overflow: hidden; }
  .peca img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .etq { position: absolute; width: 220px; height: 220px; padding: 20px; box-sizing: border-box; border-radius: 3px; display: flex; flex-direction: column; justify-content: space-between; }
  .etq b { font-size: 24px; font-weight: 600; }
  .etq span { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .etq small { display: block; font-size: 20px; font-weight: 500; margin-top: 6px; }
</style>
</head>
<body>
  <div class="logo"><svg viewBox="0 0 20 20"><path d="M10 3 2 17h16z" fill="none" stroke="#1C2618" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.2 8 10 10l2.8-2" fill="none" stroke="#1C2618" stroke-width="1.4"/></svg></div>
  <h1>Escapada<br>de desembre</h1>
  <p class="dates">Del 4 al 8 de desembre de 2026</p>
  <p class="sub">Les 5 cases candidates, amb preus per a 6 i 7 persones</p>
  <div class="peca" style="left:780px;top:40px;width:270px;height:270px;transform:rotate(-6deg)"><img src="https://a0.muscache.com/im/pictures/8533942c-5705-467f-9973-4bab1d1ab0c2.jpg?im_w=720" alt=""></div>
  <div class="peca" style="left:930px;top:290px;width:240px;height:240px;transform:rotate(4deg)"><img src="https://a0.muscache.com/im/pictures/prohost-api/Hosting-1156383494414810590/original/4daeace7-8ac4-4288-9c36-fa1cbea00c38.jpeg?im_w=720" alt=""></div>
  <div class="etq" style="left:720px;top:330px;background:#E3B2F8;transform:rotate(5deg);z-index:2"><b>Le Bellevue</b><div><span>76,86 €</span><small>per persona amb 7</small></div></div>
</body>
</html>
